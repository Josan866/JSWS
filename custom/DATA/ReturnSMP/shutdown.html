<!DOCTYPE html>
<html>
  <head>
    <title>Shutdown?</title>
    <style>
      :root{
        --color-1: #004400;
        --color-2: #225522;
        --color-3: #224411;
        --color-4: #005500;
        
        --bg-input: #717171;
      
        --bg-btn: #114411;
        
        --bg-dark: rgba(0, 0, 0, 0.7);
      }
      
      #title{position:absolute;top:10%;left:50%;transform:translate(-50%, -50%);}
      #center_top{position:absolute;top:10vh;left:50%;transform:translate(-50%, 0%);text-align:center;background-color:var(--color-2);border:1vh var(--color-3) solid;border-radius:3vh;display:inline-block;}
      #center{text-align:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background-color:var(--color-2);border:1vh var(--color-3) solid;border-radius:3vh;display:inline-block;}
      .incenter{background-color:var(--color-4);border:1vh var(--color-2) solid;border-radius:2vh;padding:2vh;}
      #secret{text-align:right;position:absolute;top:100%;left:100%;transform:translate(-100%, -100%);}
      
      .primary{background-color:var(--color-1);}
      .secondary{background-color:var(--color-2);}
      .btn{color:#ffffff;background-color:var(--bg-btn);border:0.5vh var(--bg-btn) solid;border-radius:1vh;padding:1vh;}
      .dark-bg{background:var(--bg-dark);width:100%;height:100%;position:absolute;transform:translate(-5vh, -5vh);padding:1vh;background-attachment: fixed;}
      .item{display: flex;align-items: center;gap: 10px;}
      
      body{background-color:var(--color-1);margin:20px;font-family:arial;padding:10px;}
      input{background-color:var(--bg-input)}
      input[type="number"]{width:50px;position:absolute;left:100%;transform:translate(-120%);}
    </style>
  </head>
  <body id="web" onLoad="run()">
    <script>
      function run() {
        const body = document.getElementById('web');
        fetch('https://www.cinterop.de/~josh/ReturnSMP/shutdown.php')
          .then(response => {
                if (!response.ok) {
                    throw new Error('Netzwerk-Fehler: ' + response.status);
                }
                return response.text();
            })
            .then(data => {
                body.innerHTML = data;
            })
            .catch(error => {
                console.error('Fehler beim Laden:', error);
                body.innerHTML = 'Inhalt konnte nicht geladen werden.';
            });
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head id="head">
    <meta name="theme-color" content="#ff00e1">
    <meta property="og:title" content="Hex Color: #ff00e1">
    <meta property="og:description" content="Vorschau für deine Wunschfarbe.">
    <title>Hex_Shower</title>
    <style>
      body{margin: 0px;padding: 0px; background-color: #000000}
      div{margin: 0px;padding: 0px; width: 100vw; height: 100vh}
    </style>
  </head>
  <body id="body" onload="load()"></body>
  <script>
    const urlcd = window.location.search
    const urlParams = new URLSearchParams(urlcd)
    let urlpar1 = urlParams.get('c');
    
    function load() {
      document.getElementById("body").innerHTML = "<div style=\"background-color: #" + urlpar1 + ";\"></div>"
      document.getElementById("head").innerHTML = 'meta name="theme-color" content="' + urlpar1 + '"><meta property="og:title" content="Hex Color: ' + urlpar1 + '"><meta property="og:description" content="Vorschau für deine Wunschfarbe."><title>Hex_Shower</title>'
    }
  </script>
</html>

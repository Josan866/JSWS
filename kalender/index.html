<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body onLoad="loaded()">
    <div id="center">
      <div id="incenter">
        <h3 id="name"></h3>
        <h2 id="type">Lädt...</h2>
        <h1 id="days"></h1>
        <h3 id="date"></h3>
      </div>
    </div>
  </body>
  <script>
    function loaded() {
      load();
      setInterval(() => load(), 30 * 60 * 1000);
    }
    
    function load() {
      fetch("https://www.cinterop.de/~josh/rks-clz/kalender/nextFree.php?id=name")
          .then(response => response.text())
          .then(data => {
            document.getElementById('name').innerHTML = data;
          })
          .catch(error => {
            console.error("Fehler beim Laden:", error);
            document.getElementById('name').innerHTML = "Fehler beim Laden";
          });
      fetch("https://www.cinterop.de/~josh/rks-clz/kalender/nextFree.php?id=type")
          .then(response => response.text())
          .then(data => {
            document.getElementById('type').innerHTML = data + " in";
          })
          .catch(error => {
            console.error("Fehler beim Laden:", error);
            document.getElementById('type').innerHTML = "Fehler beim Laden";
          });
      fetch("https://www.cinterop.de/~josh/rks-clz/kalender/nextFree.php?id=days")
          .then(response => response.text())
          .then(data => {
            document.getElementById('days').innerHTML = data + (data > 1 ? " Tagen" : " Tag");
          })
          .catch(error => {
            console.error("Fehler beim Laden:", error);
            document.getElementById('days').innerHTML = "Fehler beim Laden";
          });
      fetch("https://www.cinterop.de/~josh/rks-clz/kalender/nextFree.php?id=date")
          .then(response => response.text())
          .then(data => {
            document.getElementById('date').innerHTML = data;
          })
          .catch(error => {
            console.error("Fehler beim Laden:", error);
            document.getElementById('date').innerHTML = "Fehler beim Laden";
          });
    }
  </script>
</html>
